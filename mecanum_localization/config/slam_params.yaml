slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # TF frames — must match your robot
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    scan_topic: /scan

    mode: mapping

    # How often to process a scan
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2

    # Map resolution — match your existing map
    resolution: 0.05

    # Don't load a previous map
    map_file_name: ""
    map_start_at_dock: false
